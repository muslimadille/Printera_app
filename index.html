    <script>
      (function () {
        try {
          var stored = localStorage.getItem('printCalc_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark =
            stored === 'dark' ||
            (stored === 'system' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root"></div>
    <!-- Kill stuck VitePWA SWs on localhost before the app boots (dual-React / Invalid hook call). -->
    <script>
      (function () {
        var host = location.hostname;
        var local = host === "localhost" || host === "127.0.0.1";
        var boot = function () {
          var s = document.createElement("script");
          s.type = "module";
          s.src = "/src/main.tsx";
          document.body.appendChild(s);
        };
        if (!local || !("serviceWorker" in navigator)) {
          boot();
          return;
        }
        var hadController = !!navigator.serviceWorker.controller;
        Promise.resolve()
          .then(function () {
            return navigator.serviceWorker.getRegistrations();
          })
          .then(function (regs) {
            // Push self-destroying SW update first (replaces broken Workbox /dev-sw.js).
            var updates = regs.map(function (r) {
              return r.update().catch(function () {
                return null;
              });
            });
            return Promise.all(updates).then(function () {
              return regs;
            });
          })
          .then(function (regs) {
            return Promise.all(
              regs.map(function (r) {
                return r.unregister();
              })
            ).then(function () {
              return typeof caches !== "undefined" ? caches.keys() : [];
            });
          })
          .then(function (keys) {
            return Promise.all(
              (keys || []).map(function (k) {
                return caches.delete(k);
              })
            );
          })
          .then(function () {
            if (hadController && !sessionStorage.getItem("printera:html-sw-purge")) {
              sessionStorage.setItem("printera:html-sw-purge", "1");
              location.reload();
              return;
            }
            boot();
          })
          .catch(function () {
            boot();
          });
      })();
    </script>
